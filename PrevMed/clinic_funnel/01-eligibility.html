<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Coverage – Bold Care</title>
  <link rel="stylesheet" href="funnel.css" />
</head>
<body>
<div class="cf-page">

  <!-- Nav -->
  <nav class="cf-nav" role="navigation">
    <a href="javascript:history.back()" class="cf-nav-btn" aria-label="Go back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 12L6 8L10 4" stroke="#140d26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="cf-logo" aria-label="Bold">
      <div class="logo-lines"><img src="../../Fitness/dynamic-header/assets/logos/nav-logo-lines.svg" alt="" /></div>
      <div class="logo-text"><img src="../../Fitness/dynamic-header/assets/logos/nav-logo-text.svg" alt="Bold" /></div>
    </div>
    <div class="cf-nav-btn is-hidden" aria-hidden="true"></div>
  </nav>

  <!-- Content -->
  <main class="cf-content">

    <!-- Heading -->
    <div>
      <h1 class="cf-heading" style="margin-bottom:8px;">You are fully covered!</h1>
      <p class="cf-body">
        Your UnitedHealthcare plan offers
        <strong>$0 copay</strong>
        visits for virtual appointments with in-network providers, like Bold.
        <a href="#" class="cf-link">Learn more.</a>
      </p>
    </div>

    <!-- Insurance card -->
    <div class="cf-insurance-wrap">
      <div class="cf-insurance-card">
        <div class="cf-insurance-name">UnitedHealthcare</div>
        <div>
          <div class="cf-insurance-member-name">Kathleen K.</div>
          <div class="cf-insurance-member-id">
            Member ID:&nbsp;
            <strong>*********789</strong>
          </div>
        </div>
        <!-- Seal check (verified badge) -->
        <div class="cf-seal-check" aria-hidden="true">
          <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25 3L29.5 8.5L36.5 6.5L38 13.5L44.5 16L42 23L46 29L40.5 33L40 40.5L33 40L29 46L25 43L21 46L17 40L10 40.5L9.5 33L4 29L8 23L5.5 16L12 13.5L13.5 6.5L20.5 8.5L25 3Z" fill="#00887a"/>
            <path d="M17 25L22 30L33 19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Edit row -->
    <div class="cf-edit-row">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="7" stroke="#140d26" stroke-width="1.5"/>
        <path d="M8 7V11M8 5V5.5" stroke="#140d26" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>Is it correct? <a href="#" class="cf-link">Edit information.</a></span>
    </div>

  </main>

  <!-- Sticky CTA -->
  <div class="cf-footer-cta">
    <a href="02-matching.html" class="bold-btn bold-btn-primary bold-btn-full" role="button">
      Continue
    </a>
    <div class="cf-home-bar" aria-hidden="true"></div>
  </div>

</div>
</body>
</html>
