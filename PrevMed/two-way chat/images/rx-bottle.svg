<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <title>Photo of a pharmacy bottle labeled Lisinopril 10 mg</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EEE7"/>
      <stop offset="1" stop-color="#E7DFD4"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8CBB9"/>
      <stop offset="1" stop-color="#C9B9A4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9E4F12"/>
      <stop offset="0.28" stop-color="#D98A33"/>
      <stop offset="0.55" stop-color="#E9A552"/>
      <stop offset="1" stop-color="#A9571A"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCDCDC"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D2D2D2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#wall)"/>
  <rect y="560" width="600" height="240" fill="url(#table)"/>
  <rect y="558" width="600" height="4" fill="#BFAF99" opacity="0.6"/>

  <ellipse cx="310" cy="690" rx="230" ry="34" fill="#6E5A44" opacity="0.35" filter="url(#soft)"/>

  <g transform="rotate(-3 300 420)">
    <rect x="100" y="228" width="400" height="460" rx="40" fill="url(#amber)"/>
    <rect x="112" y="240" width="22" height="430" rx="11" fill="#FFFFFF" opacity="0.18"/>
    <rect x="88" y="206" width="424" height="36" rx="10" fill="#8E4610"/>
    <rect x="80" y="112" width="440" height="104" rx="20" fill="url(#cap)"/>
    <g stroke="#C9C9C9" stroke-width="3" opacity="0.8">
      <line x1="120" y1="124" x2="120" y2="204"/><line x1="160" y1="124" x2="160" y2="204"/>
      <line x1="200" y1="124" x2="200" y2="204"/><line x1="240" y1="124" x2="240" y2="204"/>
      <line x1="280" y1="124" x2="280" y2="204"/><line x1="320" y1="124" x2="320" y2="204"/>
      <line x1="360" y1="124" x2="360" y2="204"/><line x1="400" y1="124" x2="400" y2="204"/>
      <line x1="440" y1="124" x2="440" y2="204"/><line x1="480" y1="124" x2="480" y2="204"/>
    </g>

    <rect x="118" y="292" width="364" height="336" rx="10" fill="#FFFFFF"/>
    <rect x="118" y="292" width="364" height="48" rx="10" fill="#1F3F66"/>
    <rect x="118" y="322" width="364" height="18" fill="#1F3F66"/>
    <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#1B1B1B">
      <text x="136" y="324" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">COASTLINE PHARMACY</text>
      <text x="136" y="378" font-size="26" font-weight="600" fill="#3A3A3A">Carol Simmons</text>
      <text x="136" y="428" font-size="38" font-weight="800">Lisinopril 10 mg</text>
      <text x="136" y="474" font-size="28">Take 1 tablet by mouth</text>
      <text x="136" y="510" font-size="28">once a day.</text>
      <line x1="136" y1="532" x2="464" y2="532" stroke="#D5D5D5" stroke-width="2"/>
      <text x="136" y="566" font-size="24" fill="#3A3A3A">Qty 30 · Refills 3</text>
      <text x="136" y="600" font-size="24" fill="#3A3A3A">For blood pressure · Filled 08/30/26</text>
    </g>
  </g>

  <ellipse cx="505" cy="700" rx="26" ry="15" fill="#FAFAF7"/>
  <ellipse cx="505" cy="697" rx="26" ry="13" fill="#FFFFFF"/>
  <line x1="484" y1="697" x2="526" y2="697" stroke="#E4E1DA" stroke-width="2"/>
  <ellipse cx="548" cy="724" rx="24" ry="14" fill="#F6F4EF"/>
  <ellipse cx="548" cy="721" rx="24" ry="12" fill="#FFFFFF"/>
</svg>
