<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your conditions — Bold Weight Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="funnel.css" />
  <link rel="stylesheet" href="steps.css" />
</head>
<body>

  <div class="st-statusbar-fill" aria-hidden="true"></div>

  <div class="cf-page">

    <nav class="cf-nav" aria-label="Conditions question">
      <a class="cf-nav-btn" href="05-screening.html" aria-label="Go back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <span class="cf-logo" role="img" aria-label="Bold">
        <span class="logo-lines"><img src="assets/lp/logo-lines.svg" alt="" /></span>
        <span class="logo-text"><img src="assets/lp/logo-text.svg" alt="" /></span>
      </span>
      <span class="cf-nav-btn is-hidden" aria-hidden="true"></span>
    </nav>

    <main class="st-content">
      <div class="st-intro">
        <p class="st-eyebrow">Question 2 of 6</p>
        <h1 class="cf-heading">Have you been diagnosed with any of these conditions?</h1>
        <p class="cf-body">This helps Bold tailor your care.</p>
      </div>

      <fieldset class="cf-checkbox-group" data-checkgroup data-continue="#continue-btn"
                aria-label="Have you been diagnosed with any of these conditions?">
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="t1d" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Type 1 diabetes</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="t2d" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Type 2 diabetes</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="sleep-apnea" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Sleep apnea</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="fatty-liver" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Fatty liver disease</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="pancreatitis" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Pancreatitis</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="mtc-men2" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Medullary thyroid cancer MTC or MEN 2 (yourself or family history)</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="gastroparesis" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Severe stomach problems that slow digestion (gastroparesis)</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="constipation" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Chronic constipation</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="bowel-obstruction" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">History of bowel obstruction</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="cardiac-event" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">A heart attack or stroke in the last 6 months</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="conditions" value="hf-hospital" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">A hospital stay for heart failure in the last 6 months</span>
        </label>
        <label class="cf-checkbox-option cf-checkbox-option--exclusive">
          <input type="checkbox" name="conditions" value="none" data-exclusive />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">None of the above</span>
        </label>
      </fieldset>
    </main>

    <footer class="st-footer">
      <div class="st-actions">
        <button id="continue-btn" class="Button Button---primary Button---purple Button---full"
                type="button" data-next="07-measurements.html" disabled>Continue</button>
      </div>
    </footer>

  </div>

  <script src="steps.js"></script>
</body>
</html>
