<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Height &amp; weight — Bold Weight Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="funnel.css" />
  <link rel="stylesheet" href="steps.css" />
  <style>
    .ms-fields { display: flex; flex-direction: column; gap: 16px; }
    .ms-toggle {
      display: block; margin: 8px auto 0;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-family); font-size: 16px; font-weight: 600;
      color: var(--color-purple-600); text-decoration: underline; padding: 8px;
    }
  </style>
</head>
<body>

  <div class="st-statusbar-fill" aria-hidden="true"></div>

  <div class="cf-page">

    <nav class="cf-nav" aria-label="Height and weight">
      <a class="cf-nav-btn" href="06-conditions.html" aria-label="Go back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <span class="cf-logo" role="img" aria-label="Bold">
        <span class="logo-lines"><img src="assets/lp/logo-lines.svg" alt="" /></span>
        <span class="logo-text"><img src="assets/lp/logo-text.svg" alt="" /></span>
      </span>
      <span class="cf-nav-btn is-hidden" aria-hidden="true"></span>
    </nav>

    <main class="st-content">
      <div class="st-intro">
        <p class="st-eyebrow">Question 3 of 6</p>
        <h1 class="cf-heading">What's your height and weight?</h1>
        <p class="cf-body">This helps Bold tailor your care.</p>
      </div>

      <!-- Imperial (default) -->
      <div class="ms-fields" id="ms-imperial">
        <div class="cf-field">
          <label class="cf-field-label" for="ft">Height</label>
          <div class="cf-input-row">
            <div class="cf-input-wrap">
              <input class="cf-input" id="ft" name="feet" type="number" inputmode="numeric" min="0" placeholder="Feet" data-req aria-label="Height in feet" />
              <span class="cf-input-unit">ft</span>
            </div>
            <div class="cf-input-wrap">
              <input class="cf-input" id="in" name="inches" type="number" inputmode="numeric" min="0" max="11" placeholder="Inches" aria-label="Height in inches" />
              <span class="cf-input-unit">in</span>
            </div>
          </div>
        </div>
        <div class="cf-field">
          <label class="cf-field-label" for="lbs">Weight</label>
          <div class="cf-input-wrap">
            <input class="cf-input" id="lbs" name="pounds" type="number" inputmode="numeric" min="0" placeholder="Pounds" data-req aria-label="Weight in pounds" />
            <span class="cf-input-unit">lbs</span>
          </div>
        </div>
      </div>

      <!-- Metric -->
      <div class="ms-fields" id="ms-metric" hidden>
        <div class="cf-field">
          <label class="cf-field-label" for="cm">Height</label>
          <div class="cf-input-wrap">
            <input class="cf-input" id="cm" name="cm" type="number" inputmode="numeric" min="0" placeholder="Centimeters" data-req aria-label="Height in centimeters" />
            <span class="cf-input-unit">cm</span>
          </div>
        </div>
        <div class="cf-field">
          <label class="cf-field-label" for="kg">Weight</label>
          <div class="cf-input-wrap">
            <input class="cf-input" id="kg" name="kg" type="number" inputmode="numeric" min="0" placeholder="Kilograms" data-req aria-label="Weight in kilograms" />
            <span class="cf-input-unit">kg</span>
          </div>
        </div>
      </div>

      <button class="ms-toggle" id="ms-toggle" type="button">Switch to cm / kg</button>
    </main>

    <footer class="st-footer">
      <div class="st-actions">
        <button id="continue-btn" class="Button Button---primary Button---purple Button---full"
                type="button" disabled>Continue</button>
      </div>
    </footer>

  </div>

  <script>
    (function () {
      var imperial = document.getElementById('ms-imperial');
      var metric   = document.getElementById('ms-metric');
      var toggle   = document.getElementById('ms-toggle');
      var btn      = document.getElementById('continue-btn');
      var NEXT     = '08-medications.html';
      var isMetric = false;

      function refresh() {
        var scope = isMetric ? metric : imperial;
        var ok = true;
        scope.querySelectorAll('[data-req]').forEach(function (i) {
          if (!i.value.trim()) ok = false;
        });
        btn.disabled = !ok;
      }
      function setMetric(m) {
        isMetric = m;
        metric.hidden = !m;
        imperial.hidden = m;
        toggle.textContent = m ? 'Switch to ft / lb' : 'Switch to cm / kg';
        refresh();
      }
      toggle.addEventListener('click', function () { setMetric(!isMetric); });
      document.addEventListener('input', refresh);
      btn.addEventListener('click', function () { if (!btn.disabled) location.href = NEXT; });
      setMetric(false);
    })();
  </script>

</body>
</html>
