<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weight-loss medications — Bold Weight Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="funnel.css" />
  <link rel="stylesheet" href="steps.css" />
</head>
<body>

  <div class="st-statusbar-fill" aria-hidden="true"></div>

  <div class="cf-page">

    <nav class="cf-nav" aria-label="Weight-loss medications">
      <a class="cf-nav-btn" href="07-measurements.html" aria-label="Go back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <span class="cf-logo" role="img" aria-label="Bold">
        <span class="logo-lines"><img src="assets/lp/logo-lines.svg" alt="" /></span>
        <span class="logo-text"><img src="assets/lp/logo-text.svg" alt="" /></span>
      </span>
      <span class="cf-nav-btn is-hidden" aria-hidden="true"></span>
    </nav>

    <main class="st-content">
      <div class="st-intro">
        <p class="st-eyebrow">Question 4 of 6</p>
        <h1 class="cf-heading">Where are you with weight-loss medicines like Wegovy® or Zepbound®?</h1>
        <p class="cf-body">There's no wrong answer — this just helps your doctor plan the right next step for you.</p>
      </div>

      <fieldset class="cf-radio-group" data-autoadvance="09-history.html"
                aria-label="Where are you with weight-loss medicines like Wegovy or Zepbound?">
        <label class="cf-radio-option">
          <input type="radio" name="meds" value="on_now" />
          <span class="cf-radio-indicator" aria-hidden="true"></span>
          <span class="cf-radio-label">I'm taking one now</span>
        </label>
        <label class="cf-radio-option">
          <input type="radio" name="meds" value="past_would_retry" />
          <span class="cf-radio-indicator" aria-hidden="true"></span>
          <span class="cf-radio-label">I stopped one — I'd try again if it felt safer or cost less</span>
        </label>
        <label class="cf-radio-option">
          <input type="radio" name="meds" value="past_declined" />
          <span class="cf-radio-indicator" aria-hidden="true"></span>
          <span class="cf-radio-label">I tried one, and it's not for me</span>
        </label>
        <label class="cf-radio-option">
          <input type="radio" name="meds" value="never_curious" />
          <span class="cf-radio-indicator" aria-hidden="true"></span>
          <span class="cf-radio-label">I've never taken one, but I'm curious</span>
        </label>
        <label class="cf-radio-option">
          <input type="radio" name="meds" value="never_without" />
          <span class="cf-radio-indicator" aria-hidden="true"></span>
          <span class="cf-radio-label">I'd rather lose weight without one</span>
        </label>
      </fieldset>
    </main>

  </div>

  <script src="steps.js"></script>
</body>
</html>
