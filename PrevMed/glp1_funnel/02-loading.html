<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checking coverage — Bold Weight Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="funnel.css" />
  <link rel="stylesheet" href="steps.css" />
  <style>
    /* ── Coverage-check loader (Figma 932:7871) ── */
    .ld-page {
      min-height: 100vh; background: #fff;
      display: flex; flex-direction: column;
      font-family: var(--font-family); color: var(--color-gray-950);
      padding-top: 54px;                 /* clear harness status bar */
      -webkit-font-smoothing: antialiased;
      transition: opacity 400ms ease;
    }
    .ld-page.ld-leaving { opacity: 0; }

    .ld-progress { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .ld-title { font-size: 18px; font-weight: 600; line-height: 24px; color: var(--color-gray-950); text-align: center; }
    .ld-bar { width: 100%; height: 4px; background: var(--color-gray-200); border-radius: 4px; overflow: hidden; }
    .ld-bar-fill { height: 100%; width: 0; background: var(--color-purple-600); border-radius: 4px; animation: ld-fill 6s linear forwards; }
    @keyframes ld-fill { from { width: 0; } to { width: 100%; } }

    .ld-body { flex: 1; padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
    .ld-hero { width: 100%; height: 216px; object-fit: cover; border-radius: var(--radius-xl); }
    .ld-lead { font-size: 16px; font-weight: 600; line-height: 24px; color: var(--color-gray-900); }
    .ld-hipaa { margin-top: auto; justify-content: center; }

    /* sequential top→down reveal */
    .ld-reveal { opacity: 0; transform: translateY(10px); animation: ld-in 500ms ease-out forwards; }
    /* Image, lead, and HIPAA show immediately with the bar (no delay). The 3 check
       points (children 3-5) load sequentially over the first 6s, and the bar fills
       in that same 6s. The final 3s is a static hold — nothing new loads — before
       advancing, so total time stays ~9s. */
    .ld-reveal:nth-child(3) { animation-delay: 0s; }
    .ld-reveal:nth-child(4) { animation-delay: 3s; }
    .ld-reveal:nth-child(5) { animation-delay: 6s; }
    @keyframes ld-in { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .ld-bar-fill { animation: none; width: 100%; }
      .ld-reveal { animation: none; opacity: 1; transform: none; }
      .ld-page { transition: none; }
    }
  </style>
</head>
<body>

  <div class="st-statusbar-fill" aria-hidden="true"></div>

  <div class="ld-page" id="ld-page">
    <!-- Progress -->
    <div class="ld-progress">
      <p class="ld-title" role="status">Checking coverage…</p>
      <div class="ld-bar" role="progressbar" aria-label="Checking coverage" aria-valuetext="Checking…">
        <div class="ld-bar-fill"></div>
      </div>
    </div>

    <!-- Content, revealed top → down -->
    <main class="ld-body">
      <img class="ld-hero" src="assets/lp/figma-loading-hero.jpg"
           alt="An older woman on a video visit with her Bold Care provider." />

      <p class="ld-lead">The only program designed for adults 65+</p>

      <div class="st-check ld-reveal">
        <svg class="st-check-ic" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3366ff"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="st-check-text">FDA-approved GLP-1, now $50/month with Medicare</span>
      </div>
      <div class="st-check ld-reveal">
        <svg class="st-check-ic" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3366ff"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="st-check-text">Lose fat, not muscle</span>
      </div>
      <div class="st-check ld-reveal">
        <svg class="st-check-ic" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3366ff"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="st-check-text">Doctor-supervised care</span>
      </div>

      <div class="cf-hipaa-strip ld-hipaa">
        <span class="cf-hipaa-icon" aria-hidden="true">HIPAA<br>COMPLIANT</span>
        <span>Bold is HIPAA compliant.</span>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var page = document.getElementById('ld-page');
      var NEXT = '03-covered.html';
      // Content + bar finish by ~6s, then a 3s static hold; fade out and advance at ~9s.
      setTimeout(function () {
        page.classList.add('ld-leaving');
        setTimeout(function () { location.href = NEXT; }, 400);
      }, 9000);
    })();
  </script>

</body>
</html>
