<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A few quick questions — Bold Weight Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="funnel.css" />
  <link rel="stylesheet" href="steps.css" />
</head>
<body>

  <div class="st-statusbar-fill" aria-hidden="true"></div>

  <div class="cf-page">

    <nav class="cf-nav" aria-label="Screening question">
      <a class="cf-nav-btn" href="04-personalize.html" aria-label="Go back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <span class="cf-logo" role="img" aria-label="Bold">
        <span class="logo-lines"><img src="assets/lp/logo-lines.svg" alt="" /></span>
        <span class="logo-text"><img src="assets/lp/logo-text.svg" alt="" /></span>
      </span>
      <span class="cf-nav-btn is-hidden" aria-hidden="true"></span>
    </nav>

    <main class="st-content">
      <div class="st-intro">
        <p class="st-eyebrow">Question 1 of 6</p>
        <h1 class="cf-heading">Do any of the following apply to you?</h1>
        <p class="cf-body">Let's make sure Bold Care is the right option for you.</p>
      </div>

      <fieldset class="cf-checkbox-group" data-checkgroup data-continue="#continue-btn"
                aria-label="Do any of the following apply to you?">
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="surgery" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Weight-loss surgery in the last 2 years</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="kidney" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Stage 4 or 5 kidney disease or currently on dialysis</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="cancer" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Ongoing cancer treatment</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="substance" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Challenges with alcohol or drug use</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="eating-disorder" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">An eating disorder (now or in the last 2 years)</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="mental-health" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Untreated mental health condition (depression, anxiety, bipolar etc)</span>
        </label>
        <label class="cf-checkbox-option">
          <input type="checkbox" name="screening" value="weight-loss" />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">Unintentional weight loss of more than 5% in the last 6 months</span>
        </label>
        <label class="cf-checkbox-option cf-checkbox-option--exclusive">
          <input type="checkbox" name="screening" value="none" data-exclusive />
          <span class="cf-checkbox-indicator" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="cf-checkbox-label">None of the above</span>
        </label>
      </fieldset>
    </main>

    <footer class="st-footer">
      <div class="st-actions">
        <button id="continue-btn" class="Button Button---primary Button---purple Button---full"
                type="button" data-next="06-conditions.html" disabled>Continue</button>
      </div>
    </footer>

  </div>

  <script src="steps.js"></script>
</body>
</html>
