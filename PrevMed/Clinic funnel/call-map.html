<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }

    html, body {
      width: 393px;
      height: 852px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      background: #fafafa;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      width: 393px;
      height: 852px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Status bar ── */
    .status-bar {
      height: 56px;
      background: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 10px;
      flex-shrink: 0;
    }
    .status-time {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.3px;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Nav header ── */
    .nav-header {
      height: 56px;
      background: #fff;
      border-bottom: 3px solid #7c3aed;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 1px 3px rgba(16,24,40,0.1), 0 1px 2px rgba(16,24,40,0.06);
      flex-shrink: 0;
      position: relative;
    }
    .nav-back-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(16,24,40,0.05);
      flex-shrink: 0;
    }
    .nav-logo-wrap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .nav-spacer {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      opacity: 0;
    }

    /* ── Scrollable content ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Heading */
    .heading-group {
      display: flex;
      flex-direction: column;
    }
    .heading-label {
      font-size: 14px;
      font-weight: 600;
      color: #171717;
      line-height: 22px;
    }
    .heading-title {
      font-size: 24px;
      font-weight: 600;
      color: #171717;
      line-height: 32px;
      letter-spacing: -0.5px;
    }

    /* Hero image */
    .hero-image {
      width: 100%;
      height: 182px;
      border-radius: 8px;
      overflow: hidden;
      background: #d9d9d9;
      flex-shrink: 0;
    }
    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* Steps list */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .step-row {
      display: flex;
      gap: 24px;
      align-items: stretch;
    }
    .step-col-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .step-circle {
      width: 40px;
      height: 40px;
      border-radius: 100px;
      background: #5200d4;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-circle.step-last {
      background: #ddd6fe;
    }
    .step-num {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      line-height: 24px;
    }
    .step-connector {
      flex: 1;
      width: 2px;
      min-height: 8px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(82,0,212,0.3) 0px,
        rgba(82,0,212,0.3) 4px,
        transparent 4px,
        transparent 8px
      );
    }
    .step-text-wrap {
      flex: 1;
      padding-top: 8px;
      padding-bottom: 32px;
    }
    .step-row:last-child .step-text-wrap {
      padding-bottom: 0;
    }
    .step-text {
      font-size: 18px;
      font-weight: 600;
      color: #171717;
      line-height: 24px;
    }

    /* ── Bottom actions ── */
    .bottom-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 16px 0;
      background: linear-gradient(to bottom, rgba(245,245,245,0) 0%, #f5f5f5 25%);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .continue-btn {
      width: 100%;
      padding: 12px 16px;
      background: #5200d4;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      text-align: center;
      line-height: 24px;
    }
    .home-indicator {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }
    .home-bar {
      width: 134px;
      height: 5px;
      background: #262626;
      border-radius: 100px;
    }

    /* ── Fade-in entrance animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .heading-group,
    .hero-image,
    .step-row {
      opacity: 0;
      animation: fadeUp 0.7s ease-out forwards;
    }

    .heading-group          { animation-delay: 0ms; }
    .hero-image             { animation-delay: 250ms; }
    .step-row:nth-child(1)  { animation-delay: 500ms; }
    .step-row:nth-child(2)  { animation-delay: 750ms; }
    .step-row:nth-child(3)  { animation-delay: 1000ms; }
    .step-row:nth-child(4)  { animation-delay: 1250ms; }
  </style>
</head>
<body>

<div class="screen">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0" y="7" width="3" height="5" rx="0.8" fill="#1d1d1f"/>
        <rect x="4.5" y="4.5" width="3" height="7.5" rx="0.8" fill="#1d1d1f"/>
        <rect x="9" y="2" width="3" height="10" rx="0.8" fill="#1d1d1f"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.8" fill="#1d1d1f"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 9.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z" fill="#1d1d1f"/>
        <path d="M4.1 7.2a5.5 5.5 0 0 1 7.8 0" stroke="#1d1d1f" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M1.3 4.4a9.5 9.5 0 0 1 13.4 0" stroke="#1d1d1f" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1d1d1f" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="17" height="8" rx="2" fill="#1d1d1f"/>
        <path d="M22.5 4v4a2 2 0 0 0 0-4Z" fill="#1d1d1f" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Nav header -->
  <div class="nav-header">
    <button class="nav-back-btn" aria-label="Back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 13L5 8L10 3" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="nav-logo-wrap">
      <img src="https://www.figma.com/api/mcp/asset/7f9cdd65-f2be-454c-9a4f-086564291058" alt="Bold" width="97" height="27" />
    </div>
    <div class="nav-spacer"></div>
  </div>

  <!-- Scrollable content -->
  <div class="content">

    <div class="heading-group">
      <span class="heading-label">What's next</span>
      <h1 class="heading-title">Only a few steps on your way to feel better and live bolder</h1>
    </div>

    <div class="hero-image">
      <img src="https://www.figma.com/api/mcp/asset/be02cafa-854b-4c3f-b26a-a43d2a592802" alt="A woman and child in a garden" />
    </div>

    <div class="steps-list">

      <div class="step-row">
        <div class="step-col-left">
          <div class="step-circle"><span class="step-num">1</span></div>
          <div class="step-connector"></div>
        </div>
        <div class="step-text-wrap">
          <span class="step-text">Share your health and goals</span>
        </div>
      </div>

      <div class="step-row">
        <div class="step-col-left">
          <div class="step-circle"><span class="step-num">2</span></div>
          <div class="step-connector"></div>
        </div>
        <div class="step-text-wrap">
          <span class="step-text">Match with the right provider</span>
        </div>
      </div>

      <div class="step-row">
        <div class="step-col-left">
          <div class="step-circle"><span class="step-num">3</span></div>
          <div class="step-connector"></div>
        </div>
        <div class="step-text-wrap">
          <span class="step-text">Meet 1-on-1 online and get your personalized Action Plan</span>
        </div>
      </div>

      <div class="step-row">
        <div class="step-col-left">
          <div class="step-circle step-last">
            <img src="https://www.figma.com/api/mcp/asset/10af81d7-99e8-4c34-aab7-602a87673510" alt="" width="16" height="16" />
          </div>
        </div>
        <div class="step-text-wrap">
          <span class="step-text">See the difference and feel better</span>
        </div>
      </div>

    </div>

  </div>

  <!-- Bottom actions -->
  <div class="bottom-actions">
    <button class="continue-btn">Continue</button>
    <div class="home-indicator">
      <div class="home-bar"></div>
    </div>
  </div>

</div>

<script>
  document.querySelector('.continue-btn').addEventListener('click', function () {
    window.parent.postMessage({ navTo: 'focusSelection' }, '*');
  });
</script>
</body>
</html>
