<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /*
      Hand-implementation of @bold/web components for an HTML prototype.
      Source: github.com/agebold/agebold-web (master)
      - Button: packages/web/src/components/Button/Button.{tsx,module.scss}
      - Tokens: packages/web/src/styles/_variables.scss
      Storybook: https://staging-ui.agebold.com/?path=/story/button--default
    */

    :root {
      --font: Inter, system-ui, -apple-system, sans-serif;

      --color-purple: #5200d4;          /* $purple ($purple---300) */
      --color-purple-500: #29006a;       /* $purple---500 hover */
      --color-yellow: #ffcc1a;           /* $yellow ($yellow---300) */
      --color-yellow-400: #e6b300;       /* $yellow---400 hover */
      --color-ink: #140d26;              /* $ink ($ink---300) */
      --color-ink-200: #8a8693;          /* $ink---200 muted */
      --color-grey-200: #fafafa;         /* $grey---200 */
      --color-grey-300: #e5e5e5;         /* $grey---300 border */
      --color-white: #ffffff;

      --font-size-medium: 16px;          /* $font-size---medium */
      --font-size-large: 20px;           /* $font-size---large */
      --font-size-xxlarge: 36px;         /* $font-size---xxlarge */

      --font-weight-bold: 700;

      --line-height: 1.6;
      --line-height-small: 1.2;
      --letter-spacing-heading: -0.25px;

      --button-border-radius: 12px;      /* $border-radius---small */
      --button-box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); /* $box-shadow---xsmall */

      --View-padding-x-mobile: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: var(--font-size-medium);
      line-height: var(--line-height);
      color: var(--color-ink);
      background: var(--color-grey-200);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--View-padding-x-mobile);
    }

    .Page {
      width: 100%;
      max-width: 480px;
      background: var(--color-white);
      border: 1px solid var(--color-grey-300);
      border-radius: 16px;
      padding: 32px 24px;
    }

    .Heading {
      margin: 0;
      font-family: var(--font);
      font-size: var(--font-size-xxlarge);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-small);
      letter-spacing: var(--letter-spacing-heading);
      color: var(--color-ink);
    }

    .Copy {
      margin: 8px 0 0;
      font-size: var(--font-size-medium);
      line-height: var(--line-height);
      color: var(--color-ink-200);
    }

    .Actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ───────── Button (hand-implementation of @bold/web Button) ───────── */
    .Button {
      font-family: var(--font);
      cursor: pointer;
      user-select: none;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    /* Shared primary + secondary base */
    .Button---primary,
    .Button---secondary {
      border: 1px solid transparent;
      border-radius: var(--button-border-radius);
      color: var(--color-ink);
      font-size: var(--font-size-medium);
      font-weight: var(--font-weight-bold);
      padding: 13px 18px;                /* size medium */
      transition: background-color 150ms ease-in-out, border-color 150ms ease-in-out, box-shadow 150ms ease-in-out, color 150ms ease-in-out, transform 150ms ease-in-out;
    }
    .Button---primary:active,
    .Button---secondary:active {
      transform: scale(0.99);
      transition-duration: 150ms;
    }

    /* Primary variant */
    .Button---primary {
      box-shadow: var(--button-box-shadow);
    }
    .Button---primary.Button---purple {
      background: var(--color-purple);
      color: var(--color-white);
    }
    .Button---primary.Button---purple:hover,
    .Button---primary.Button---purple:focus-visible {
      background: var(--color-purple-500);
    }
    .Button---primary.Button---yellow {
      background: var(--color-yellow);
      /* yellow primary keeps ink text per source */
    }
    .Button---primary.Button---yellow:hover,
    .Button---primary.Button---yellow:focus-visible {
      background: var(--color-yellow-400);
    }

    /* Secondary variant — no bg, ink text, grey hover */
    .Button---secondary {
      background: transparent;
    }
    .Button---secondary:hover,
    .Button---secondary:focus-visible {
      background: var(--color-grey-300);
    }

    /* Focus ring — visible alternative since we don't set outline:none */
    .Button:focus-visible {
      outline: 2px solid var(--color-purple);
      outline-offset: 2px;
    }

    .Button---full {
      width: 100%;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .Button, .Button---primary, .Button---secondary {
        transition: none;
      }
      .Button---primary:active,
      .Button---secondary:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="Page">
    <h1 class="Heading">Welcome to Bold</h1>
    <p class="Copy">Your daily plan is ready. Pick how you'd like to start your session today.</p>

    <div class="Actions">
      <button type="button" class="Button Button---primary Button---purple Button---full">Start today's plan</button>
      <button type="button" class="Button Button---primary Button---yellow Button---full">Use the app</button>
      <button type="button" class="Button Button---secondary Button---full">Skip for now</button>
    </div>
  </main>
</body>
</html>
